[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dastyclaw"
version = "0.1.0"
description = "Fast, asynchronous OSINT reconnaissance and digital footprinting toolkit by pajadasty."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pajadasty" }]
keywords = ["osint", "security", "reconnaissance", "subdomain-enumeration", "footprinting", "cybersecurity", "sherlock", "dns", "dastyclaw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dastyclaw = "dastyclaw.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dastyclaw*"]
